<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>
    SLABS N GRABS ACO — Secure Admin
  </title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <style>

    [hidden] {
  display: none !important;
}
    
    /* =========================================
       ADMIN PAGE
    ========================================= */

    body.admin-page {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0,
          rgba(18, 201, 255, .10),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #050a12,
          #07101b
        );
    }

    .admin-shell {
      width: min(1250px, 100%);
      min-height: 100vh;

      margin: 0 auto;

      padding: 30px 22px 70px;
    }


    /* =========================================
       LOGIN
    ========================================= */

    .admin-login-wrap {
      min-height: calc(100vh - 60px);

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .admin-login-card {
      width: min(440px, 100%);

      margin: auto;

      padding: 32px;

      text-align: center;

      border: 1px solid #1a4a65;

      border-radius: 16px;

      background:
        linear-gradient(
          180deg,
          rgba(11, 24, 37, .97),
          rgba(7, 17, 27, .97)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .55),
        0 0 45px rgba(18, 201, 255, .08);
    }

    .admin-logo {
      display: block;

      width: 115px;
      height: 90px;

      object-fit: contain;

      margin: 0 auto 14px;
    }

    .admin-login-card h1 {
      margin: 0 0 8px;

      font-size: 28px;

      letter-spacing: -1px;
    }

    .admin-login-card .muted {
      margin-bottom: 26px;
    }

    .admin-login-card form {
      text-align: left;
    }

    .admin-login-card label {
      margin-bottom: 17px;
    }

    .admin-login-card input {
      height: 48px;
    }

    .admin-login-card .primary {
      width: 100%;

      margin-top: 5px;
    }

    #msg {
      min-height: 20px;

      margin: 13px 0 0;

      color: #ff768c;

      text-align: center;

      font-size: 12px;

      font-weight: 700;
    }


    /* =========================================
       DASHBOARD
    ========================================= */

    #dashboard {
      width: 100%;
    }

    .admin-dashboard-logo {
      display: block;

      width: 95px;
      height: 72px;

      object-fit: contain;

      margin-bottom: 10px;
    }

    .admin-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 28px;

      padding-bottom: 22px;

      border-bottom: 1px solid #17384e;
    }

    .admin-head-copy h1 {
      margin: 5px 0;

      font-size: clamp(
        28px,
        4vw,
        45px
      );

      letter-spacing: -1.5px;
    }

    .admin-head-copy p {
      margin: 0;

      color: #8e9db4;
    }

    #logout {
      border: 1px solid #28516a;

      border-radius: 8px;

      background: #0a1722;

      color: #d9f6ff;

      padding: 11px 18px;

      font-weight: 800;

      cursor: pointer;
    }

    #logout:hover {
      border-color: #12c9ff;

      color: #12c9ff;
    }


    /* =========================================
       CUSTOMER ORDER LIST
    ========================================= */

    .admin-summary {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .admin-summary-count {
      color: #8e9db4;

      font-size: 13px;
    }

    .admin-orders {
      display: grid;

      gap: 13px;
    }

    .customer-order {
      overflow: hidden;

      border: 1px solid #17384e;

      border-radius: 12px;

      background:
        linear-gradient(
          180deg,
          #091521,
          #07111b
        );
    }

    .customer-order[open] {
      border-color: #1c6a8d;

      box-shadow:
        0 0 30px
        rgba(18, 201, 255, .07);
    }

   .customer-order-summary {
  width: 100%;
  min-height: 88px;

  display: grid;

  grid-template-columns:
    minmax(190px, 1.4fr)
    minmax(120px, .8fr)
    minmax(120px, .8fr)
    minmax(190px, 1fr)
    auto;

      align-items: center;

      gap: 18px;

      padding: 17px 20px;

      cursor: pointer;

      list-style: none;

      user-select: none;
    }

    .customer-order-summary::-webkit-details-marker {
      display: none;
    }

    .customer-order-summary::marker {
      display: none;
    }

    .customer-order-summary:hover {
      background: #0a1926;
    }

    .customer-main {
      min-width: 0;
    }

    .customer-main strong {
      display: block;

      overflow: hidden;

      color: #f5fbff;

      font-size: 16px;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .customer-main small {
      display: block;

      margin-top: 5px;

      overflow: hidden;

      color: #71879b;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .order-meta small {
      display: block;

      margin-bottom: 4px;

      color: #60788e;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .order-meta strong {
      color: #dff7ff;

      font-size: 13px;
    }

    .order-plan {
      color: #12c9ff !important;
    }

    .order-chevron {
      color: #12c9ff;

      font-size: 24px;

      transition: transform .2s ease;
    }

    .customer-order[open]
    .order-chevron {
      transform: rotate(90deg);
    }


    /* =========================================
       OPEN CUSTOMER ORDER
    ========================================= */

    .customer-order-body {
      padding: 25px;

      border-top: 1px solid #17384e;

      background: #07111b;
    }

    .order-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }

    .order-top h2 {
      margin: 0 0 5px;

      font-size: 22px;
    }

    .order-id {
      color: #637a90;

      font-size: 10px;

      word-break: break-all;
    }

   .status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border: 1px solid #28516a;
  border-radius: 99px;
  background: #0a1722;
  color: #dff7ff;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
}

.status-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

.status-pill.active {
  border-color: #1f7057;
  background: #0b2a20;
  color: #63e3ad;
}

.status-pill.inactive {
  border-color: #7b2635;
  background: #2a0d14;
  color: #ff7c93;
}

.order-status-meta {
  min-width: 170px;
}

.order-status-subline {
  margin-top: 6px;
  color: #8e9db4;
  font-size: 11px;
  line-height: 1.35;
}
/* =========================================
   CUSTOMER UPDATE STATUS
========================================= */

.customer-update-meta {
  display: flex;
  align-items: flex-end;
  flex-direction: column;

  gap: 7px;
}


.customer-updated-pill {
  display: inline-flex;
  align-items: center;

  gap: 7px;

  padding: 7px 10px;

  border: 1px solid #176c86;
  border-radius: 99px;

  background: rgba(18, 201, 255, .09);

  color: #56dcff;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .4px;

  text-transform: uppercase;
}


.customer-updated-pill::before {
  content: "";

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: currentColor;

  box-shadow:
    0 0 8px currentColor;
}


.customer-last-updated {
  color: #71879b;

  font-size: 10px;
  font-weight: 700;

  text-align: right;
}


.customer-last-updated strong {
  color: #dff7ff;
}


@media (max-width: 600px) {

  .customer-update-meta {
    align-items: flex-start;
  }

  .customer-last-updated {
    text-align: left;
  }
}

    /* =========================================
       INFO PANELS
    ========================================= */

    .order-sections {
      display: grid;

      gap: 22px;
    }

    .order-section {
      overflow: hidden;

      border: 1px solid #17384e;

      border-radius: 12px;

      background: #08131e;
    }

    .order-section-head {
      padding: 17px 20px;

      border-bottom: 1px solid #17384e;

      background: #0a1723;
    }

    .order-section-head h3 {
      margin: 0;

      font-size: 16px;
    }

    .order-section-head p {
      margin: 5px 0 0;

      color: #71879b;

      font-size: 11px;
    }

    .admin-collapsible-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  cursor: pointer;
  list-style: none;
  user-select: none;
}

.admin-collapsible-head::-webkit-details-marker {
  display: none;
}

.admin-collapsible-head::marker {
  display: none;
}

.admin-collapsible-head:hover {
  background: #0c1c2a;
}

.admin-collapsible-arrow {
  flex: 0 0 auto;

  color: #12c9ff;
  font-size: 24px;
  font-weight: 700;

  transition: transform .2s ease;
}

.admin-collapsible[open]
.admin-collapsible-arrow {
  transform: rotate(90deg);
}

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 0;
    }

    .info-field {
      min-height: 78px;

      padding: 16px 20px;

      border-bottom: 1px solid #122e41;
    }

    .info-field:nth-child(odd) {
      border-right: 1px solid #122e41;
    }

    .info-field.wide {
      grid-column: 1 / -1;

      border-right: 0;
    }

    .info-field label {
      display: block;

      margin: 0 0 7px;

      color: #71879b;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .info-value {
      min-height: 18px;

      color: #eefaff;

      font-size: 13px;

      font-weight: 700;

      line-height: 1.5;

      word-break: break-word;
    }

    .info-value.muted-value {
      color: #8e9db4;
    }


    /* =========================================
       SENSITIVE VALUES
    ========================================= */

    .sensitive-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;
    }

    .sensitive-value {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .reveal-button {
      flex: 0 0 auto;

      border: 1px solid #28516a;

      border-radius: 6px;

      background: #0b1c29;

      color: #aeeeff;

      padding: 6px 9px;

      font-size: 9px;

      font-weight: 900;

      cursor: pointer;
    }

    .reveal-button:hover {
      border-color: #12c9ff;

      color: #12c9ff;
    }

    .security-note {
      margin: 0;

      padding: 14px 18px;

      border: 1px solid #765a1d;

      border-radius: 8px;

      background: #2b220c;

      color: #f2cf68;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =========================================
       SUBSCRIPTION
    ========================================= */

    .subscription-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      padding: 18px;
    }

    .subscription-stat {
      padding: 14px;

      border: 1px solid #17384e;

      border-radius: 8px;

      background: #06101a;
    }

    .subscription-stat small {
      display: block;

      margin-bottom: 7px;

      color: #61798f;

      font-size: 8px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .subscription-stat strong {
      color: #eafaff;

      font-size: 13px;
    }

    /* =========================================
   ADMIN EDITING
========================================= */
    
.admin-edit-panel {
  padding: 20px;
  border-top: 1px solid #17384e;
  background: #06101a;
}

.admin-edit-panel[hidden] {
  display: none !important;
}

.admin-edit-grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.admin-edit-field {
  display: grid;
  gap: 7px;
}

.admin-edit-field.wide {
  grid-column: 1 / -1;
}

.admin-edit-field label {
  color: #71879b;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.admin-edit-field input,
.admin-edit-field select {
  width: 100%;
  min-height: 40px;
  box-sizing: border-box;

  border: 1px solid #244b63;
  border-radius: 7px;

  background: #081723;
  color: #eefaff;

  padding: 9px 11px;

  font: inherit;
  font-size: 12px;
}

.admin-edit-field input:focus,
.admin-edit-field select:focus {
  outline: none;
  border-color: #12c9ff;
}

.admin-edit-help {
  margin: 5px 0 0;

  color: #71879b;

  font-size: 10px;
  line-height: 1.5;
}

.admin-edit-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;

  margin-top: 18px;
}

.admin-edit-button,
.admin-save-button,
.admin-cancel-button,
.load-retailer-profiles {
  border-radius: 7px;

  padding: 9px 14px;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}

.admin-edit-button,
.load-retailer-profiles {
  border: 1px solid #28516a;

  background: #0b1c29;
  color: #aeeeff;
}

.admin-save-button {
  border: 1px solid #12c9ff;

  background: #0b2533;
  color: #12c9ff;
}

.admin-cancel-button {
  border: 1px solid #405365;

  background: #111c25;
  color: #a9b7c4;
}

.admin-edit-button:hover,
.load-retailer-profiles:hover,
.admin-save-button:hover {
  border-color: #12c9ff;
  color: #12c9ff;
}

.admin-edit-message {
  margin-top: 12px;

  color: #8da6bb;

  font-size: 11px;
}

.admin-edit-message.success {
  color: #57e69b;
}

.admin-edit-message.error {
  color: #ff8799;
}


/* =========================================
   RETAILER PROFILES
========================================= */

.admin-retailer-wrap {
  padding: 18px;
}

.admin-retailer-loading,
.admin-retailer-empty {
  color: #71879b;
  font-size: 11px;
}

.admin-retailer-profile {
  overflow: hidden;

  margin-bottom: 16px;

  border: 1px solid #17384e;
  border-radius: 9px;

  background: #07131e;
}

.admin-retailer-profile:last-child {
  margin-bottom: 0;
}

.admin-retailer-profile-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

  padding: 13px 15px;

  border-bottom: 1px solid #17384e;

  background: #0a1723;
}

.admin-retailer-profile-head strong {
  color: #eefaff;
  font-size: 12px;
}

.admin-retailer-profile-head span {
  color: #12c9ff;
  font-size: 9px;
  font-weight: 900;
}

.admin-retailer-form {
  padding: 15px;
}

.admin-retailer-grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 12px;
}

.admin-retailer-block {
  padding: 13px;

  border: 1px solid #17384e;
  border-radius: 8px;

  background: #081722;
}

.admin-retailer-block h4 {
  margin: 0 0 11px;

  color: #eafaff;

  font-size: 11px;
}

    .admin-retailer-password-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-retailer-password-row input {
  flex: 1;
  min-width: 0;
}

.admin-retailer-password-row .reveal-button {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 8px 12px;
}

.admin-password-status {
  display: block;

  margin-top: 6px;

  color: #71879b;

  font-size: 9px;
}

@media (max-width: 700px) {
  .admin-edit-grid,
  .admin-retailer-grid {
    grid-template-columns: 1fr;
  }

  .admin-edit-field.wide {
    grid-column: auto;
  }
}

    .admin-retailer-password-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-retailer-password-row input {
  flex: 1;
  min-width: 0;
}

.retailer-password-toggle {
  flex: 0 0 auto;

  min-height: 40px;

  border: 1px solid #28516a;
  border-radius: 7px;

  background: #0b1c29;
  color: #aeeeff;

  padding: 8px 12px;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}

.retailer-password-toggle:hover {
  border-color: #12c9ff;
  color: #12c9ff;
}

    /* =========================================
       ACTIONS
    ========================================= */

    .order-actions {
      display: flex;

      justify-content: flex-end;

      margin-top: 20px;
    }

    .delete-submission {
      border: 1px solid #77313c;

      border-radius: 7px;

      background: #2a1015;

      color: #ff8799;

      padding: 9px 14px;

      font-size: 11px;

      font-weight: 900;

      cursor: pointer;
    }

    .delete-submission:hover {
      background: #3a131b;

      border-color: #ff5c78;
    }

    .empty-admin {
      padding: 40px;

      border: 1px solid #17384e;

      border-radius: 12px;

      background: #08131e;

      text-align: center;

      color: #8e9db4;
    }


    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 850px) {

      .customer-order-summary {
        grid-template-columns:
          1fr
          auto;
      }

      .customer-order-summary
      .order-meta {
        display: none;
      }

      .subscription-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      .admin-shell {
        padding: 15px 12px 50px;
      }

      .admin-login-card {
        padding: 25px 18px;
      }

      .admin-logo {
        width: 95px;
        height: 75px;
      }

      .admin-head {
        align-items: flex-start;

        flex-direction: column;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .info-field:nth-child(odd) {
        border-right: 0;
      }

      .info-field.wide {
        grid-column: auto;
      }

      .subscription-grid {
        grid-template-columns: 1fr;
      }

      .customer-order-body {
        padding: 15px;
      }

      .order-top {
        align-items: flex-start;

        flex-direction: column;
      }

    }

  </style>
</head>


<body class="admin-page">

<main class="admin-shell">


  <!-- =====================================
       ADMIN LOGIN
  ====================================== -->

  <div
    class="admin-login-wrap"
    id="loginWrap"
  >

    <div class="admin-login-card">

      <img
        src="/slabsngrabs-aco-logo-transparent.png"
        class="admin-logo"
        alt="SLABS N GRABS ACO"
      >

      <span class="eyebrow">
        ADMINISTRATION
      </span>

      <h1>
        Secure Admin Portal
      </h1>

      <p class="muted">
        Authorized access only.
      </p>


      <form id="loginForm">

        <label>
          Admin password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>


        <label>
          Authenticator code

          <input
            id="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="6-digit code"
            required
          >
        </label>


        <button
          class="primary"
          type="submit"
        >
          Sign in
        </button>


        <p id="msg"></p>

      </form>

    </div>

  </div>


  <!-- =====================================
       ADMIN DASHBOARD
  ====================================== -->

  <section
    id="dashboard"
    hidden
  >

    <div class="admin-head">

      <div class="admin-head-copy">

        <img
          src="/slabsngrabs-aco-logo-transparent.png"
          class="admin-dashboard-logo"
          alt="SLABS N GRABS ACO"
        >

        <span class="eyebrow">
          SECURE ADMIN
        </span>

        <h1>
          Customer Orders
        </h1>

        <p>
          Paid customer profiles and
          membership information.
        </p>

      </div>


      <button
        id="logout"
        type="button"
      >
        Log out
      </button>

    </div>


  <div class="admin-summary">

  <div
    class="admin-submission-filter-wrap"
  >

    <label
      for="submissionTypeFilter"
      class="eyebrow"
    >
      VIEW
    </label>

    <select
      id="submissionTypeFilter"
      class="admin-submission-filter"
    >
      <option value="paid">
        PAID SUBMISSIONS
      </option>

      <option value="free">
        FREE SUBMISSIONS
      </option>
    </select>

  </div>

  <span
    id="submissionCount"
    class="admin-summary-count"
  ></span>

</div>


    <div
      id="rows"
      class="admin-orders"
    ></div>

  </section>

</main>


<script>

const loginForm =
  document.getElementById(
    "loginForm"
  );

const loginWrap =
  document.getElementById(
    "loginWrap"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );

const msg =
  document.getElementById(
    "msg"
  );

const rows =
  document.getElementById(
    "rows"
  );

const submissionCount =
  document.getElementById(

/* =========================================
   HELPERS
========================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function displayValue(value) {

  const text =
    String(
      value ?? ""
    ).trim();

  return text
    ? escapeHtml(text)
    : '<span class="muted-value">—</span>';
}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return escapeHtml(value);
  }

  return date.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );
}


function formatDateTime(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return escapeHtml(value);
  }

  return escapeHtml(
    date.toLocaleString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    )
  );
}


function maskCard(value) {

  const digits =
    String(
      value ?? ""
    )
      .replace(/\D/g, "");

  if (!digits) {
    return "—";
  }

  const lastFour =
    digits.slice(-4);

  return `•••• •••• •••• ${lastFour}`;
}

function maskPassword(value) {

  if (!value) {
    return "—";
  }

  return "••••••••••••";
}


function statusText(value) {

  const status =
    String(
      value || "active"
    );

  return status
    .replaceAll(
      "_",
      " "
    );
}

  function getSubscriptionState(status, periodEnd) {
  const normalized = String(status || "").toLowerCase().trim();
  const end = periodEnd ? new Date(periodEnd) : null;
  const now = new Date();

  const expired =
    end &&
    !Number.isNaN(end.getTime()) &&
    end.getTime() < now.getTime();

  const activeStatuses = ["active", "trialing"];

  const active =
    activeStatuses.includes(normalized) &&
    !expired;

  let label = "INACTIVE";

  if (active) {
    label = "ACTIVE";
  } else if (normalized) {
    label = normalized.replaceAll("_", " ").toUpperCase();
  }

  return {
    active,
    label
  };
}

function activeThroughText(periodEnd) {
  if (!periodEnd) return "No end date";
  return `Active through ${formatDate(periodEnd)}`;
}

function daysLeftText(periodEnd) {
  if (!periodEnd) return "No days left data";

  const now = new Date();
  const end = new Date(periodEnd);

  if (Number.isNaN(end.getTime())) {
    return "No days left data";
  }

  const diffMs = end.getTime() - now.getTime();
  const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

  if (diffDays < 0) return "Expired";
  if (diffDays === 0) return "Ends today";
  if (diffDays === 1) return "1 day left";

  return `${diffDays} days left`;
}

/* =========================================
   INFORMATION FIELD
========================================= */

function field(
  label,
  value,
  wide = false
) {

  return `
    <div class="info-field ${wide ? "wide" : ""}">

      <label>
        ${escapeHtml(label)}
      </label>

      <div class="info-value">
        ${displayValue(value)}
      </div>

    </div>
  `;
}


/* =========================================
   SENSITIVE FIELD
========================================= */

function sensitiveField(
  label,
  value,
  type,
  wide = false
) {

  const raw =
    String(
      value ?? ""
    );

  let masked =
    "—";

  if (type === "card") {
    masked =
      maskCard(raw);
  }

  if (type === "password") {
    masked =
      maskPassword(raw);
  }


  return `
    <div class="info-field ${wide ? "wide" : ""}">

      <label>
        ${escapeHtml(label)}
      </label>

      <div class="sensitive-row">

        <div
          class="info-value sensitive-value"
          data-sensitive
          data-hidden="true"
          data-masked="${escapeHtml(masked)}"
          data-value="${escapeHtml(raw)}"
        >
          ${escapeHtml(masked)}
        </div>

        ${
          raw
            ? `
              <button
                type="button"
                class="reveal-button"
              >
                Show
              </button>
            `
            : ""
        }

      </div>

    </div>
  `;
}

panel.hidden =

if (opening) {

          };

          if (submitButton) {

          if (message) {

                }

            const result =

async function loadAdminRetailerProfiles(
  orderId
) {

  const container =
    document.querySelector(
      `[data-retailer-container="${CSS.escape(orderId)}"]`
    );

  if (!container) {
    return;
  }

  container.innerHTML = `
    <p class="admin-retailer-loading">
      Loading retailer profiles...
    </p>
  `;

  try {

    const response =
      await fetch(
        `/api/admin/submissions/${encodeURIComponent(orderId)}/retailer-profiles`,
        {
          credentials:
            "same-origin",

          cache:
            "no-store"
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Unable to load retailer profiles."
      );
    }

    const profiles =
      Array.isArray(
        data.profiles
      )
        ? data.profiles
        : [];

    const specialProfiles =
  Array.isArray(
    data.specialProfiles
  )
    ? data.specialProfiles
    : [];

const freeProfile =
  specialProfiles.find(
    profile =>
      profile.profileType ===
      "free"
  ) || null;

const rentedProfile =
  specialProfiles.find(
    profile =>
      profile.profileType ===
      "rented"
  ) || null;

   const normalProfilesHtml =
  profiles.length
    ? profiles
        .map(
          profile =>
            retailerProfileHtml(
              orderId,
              profile
            )
        )
        .join("")
    : `
        <p class="admin-retailer-empty">
          This customer has not saved any normal retailer profiles yet.
        </p>
      `;

const specialProfilesHtml = `
  ${specialProfileHtml(
    orderId,
    "free",
    freeProfile
  )}

  ${specialProfileHtml(
    orderId,
    "rented",
    rentedProfile
  )}
`;

container.innerHTML = `
  ${normalProfilesHtml}

  ${specialProfilesHtml}
`;

bindRetailerProfileForms();

bindSpecialProfileForms();

  } catch (error) {

    container.innerHTML = `
      <p class="admin-retailer-empty">
        ${escapeHtml(
          error.message
        )}
      </p>
    `;

  }
}

/* =========================================
   LOAD ADMIN DATA
========================================= */

async function load() {

 const submissionType =
  submissionTypeFilter?.value ===
  "free"
    ? "free"
    : "paid";

const endpoint =
  submissionType === "free"
    ? "/api/admin/free-submissions"
    : "/api/admin/submissions";

const response =
  await fetch(
    endpoint,
    {
      credentials:
        "same-origin",

      cache:
        "no-store"
    }
  );


  if (!response.ok) {

  console.error(
    "Admin submissions failed:",
    response.status,
    response.statusText
  );

  if (response.status === 401) {

    loginWrap.hidden = false;
    dashboard.hidden = true;

    msg.textContent =
      "Admin session was not accepted.";

  } else {

    loginWrap.hidden = true;
    dashboard.hidden = false;

    rows.innerHTML = `
      <div class="empty-admin">
        Admin dashboard failed to load.
        Server error: ${response.status}
      </div>
    `;
  }

  return;
}


  const data =
    await response.json();


  const submissions =
    Array.isArray(data)
      ? data
      : (
          data.submissions ||
          []
        );


  loginWrap.hidden = true;
  dashboard.hidden = false;


  submissionCount.textContent =
    submissions.length === 1
      ? "1 customer order"
      : `${submissions.length} customer orders`;


  if (!submissions.length) {

    rows.innerHTML = `
      <div class="empty-admin">

        <h3>
          No paid submissions yet.
        </h3>

        <p>
          Paid customer orders will
          appear here individually.
        </p>

      </div>
    `;

    return;
  }


  rows.innerHTML =
    submissions
      .map(renderOrder)
      .join("");

bindAdminSaveButtons();
 bindRevealButtons();
bindAdminEditButtons();
bindAdminRetailerButtons();
bindDeleteButtons();
}


/* =========================================
   REVEAL / HIDE SENSITIVE INFO
========================================= */

function bindRevealButtons() {

  document
    .querySelectorAll(
      ".reveal-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          /*
            Prevent the click from affecting
            the parent details element.
          */

          event.preventDefault();
          event.stopPropagation();


          const row =
            button.closest(
              ".sensitive-row"
            );


          const value =
            row?.querySelector(
              "[data-sensitive]"
            );


          if (!value) return;


          const hidden =
            value.dataset.hidden ===
            "true";


          if (hidden) {

            value.textContent =
              value.dataset.value ||
              "—";

            value.dataset.hidden =
              "false";

            button.textContent =
              "Hide";

          } else {

            value.textContent =
              value.dataset.masked ||
              "—";

            value.dataset.hidden =
              "true";

            button.textContent =
  "Show";

          }

        }
      );

    });
}

========================================= */

function bindDeleteButtons() {

  document
    .querySelectorAll(
      ".delete-submission"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const id =
            button.dataset.id;


          const confirmed =
            confirm(
              "Permanently delete this customer submission? This cannot be undone."
            );


          if (!confirmed) {
            return;
          }


          button.disabled = true;

          button.textContent =
            "Deleting...";


          try {

            const response =
              await fetch(
                `/api/admin/submissions/${encodeURIComponent(id)}`,
                {
                  method:
                    "DELETE",

                  credentials:
                    "same-origin"
                }
              );


            if (!response.ok) {
              throw new Error(
                "Delete failed"
              );
            }


            await load();


          } catch (error) {

            alert(
              "Unable to delete this submission."
            );

            button.disabled =
              false;

            button.textContent =
              "Delete Customer Order";

          }

        }
      );

    });
}
