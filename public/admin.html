<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLABS N GRABS ACO — Secure Admin</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>
<main class="admin-shell">

<div class="admin-login-card">
<img src="/slabsngrabs-aco-logo-transparent.png" class="admin-logo" alt="SLABS N GRABS ACO">

<h1>Secure Admin Portal</h1>
<p class="muted">Authorized access only.</p>

<form id="loginForm">
<label>Admin password
  <input id="password" type="password" autocomplete="current-password" required>
</label>

<label>Authenticator code
  <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required>
</label>

<button class="primary" type="submit">Sign in</button>
<p id="msg"></p>
</form>
</div>

<section id="dashboard" hidden>
<div class="admin-head">
<h1>Paid Customer Profiles</h1>
<button id="logout">Log out</button>
</div>

<div id="rows"></div>
</section>

</main>

<script>
const f = document.getElementById('loginForm');
const dash = document.getElementById('dashboard');
const msg = document.getElementById('msg');
const rows = Array.isArray(d) ? d : (d.submissions || []);
function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function load(){
  const r = await fetch('/api/admin/submissions');

  if(!r.ok) return;

  const data = await r.json();
  const submissions = data.submissions || data || [];

  f.parentElement.hidden = true;
  dash.hidden = false;

  if(!submissions.length){
    rows.innerHTML = '<p>No paid submissions yet.</p>';
    return;
  }

  rows.innerHTML = submissions.map(x => `
    <article class="admin-card" data-id="${escapeHtml(x.id)}">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;">
        <h3>${escapeHtml(x.profile?.profileName || x.profileName || x.id || 'Submission')}</h3>

        <button
          type="button"
          class="delete-submission"
          data-id="${escapeHtml(x.id)}"
          style="background:#b42318;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700;">
          Delete
        </button>
      </div>

      <pre>${escapeHtml(JSON.stringify(x,null,2))}</pre>

    </article>
  `).join('');

  document.querySelectorAll('.delete-submission').forEach(button => {
    button.addEventListener('click', async () => {

      const id = button.dataset.id;

      const confirmed = confirm(
        'Permanently delete this customer submission? This cannot be undone.'
      );

      if(!confirmed) return;

      button.disabled = true;
      button.textContent = 'Deleting...';

      try{
        const response = await fetch(
          `/api/admin/submissions/${encodeURIComponent(id)}`,
          {method:'DELETE'}
        );

        if(!response.ok){
          throw new Error('Delete failed');
        }

        await load();

      }catch(err){
        alert('Unable to delete this submission.');
        button.disabled = false;
        button.textContent = 'Delete';
      }
    });
  });
}

f.addEventListener('submit', async e => {
  e.preventDefault();

  msg.textContent = '';

  const r = await fetch('/api/admin/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    password:document.getElementById('password').value,
    code:document.getElementById('code').value
  })
});

  if(r.ok){
    document.getElementById('password').value = '';
    load();
  }else{
    msg.textContent = 'Invalid credentials.';
  }
});

document.getElementById('logout').onclick = async () => {
  await fetch('/api/admin/logout',{method:'POST'});
  location.reload();
};

load();
</script>

</body>
</html>
