name: Verify notifications once per event
on:
  push:
    branches: [main, fix/shipping-dm-once-per-order-stage-20261022]
    paths:
      - 'notification-delivery-guard.js'
      - 'shipping-discord-dm-ledger.js'
      - 'order-notifications.js'
      - 'admin-push.js'
      - 'membership-lapse-notifications.js'
      - 'discord-community.js'
      - 'server.js'
      - 'test/notification-delivery-guard.test.mjs'
      - 'test/notification-wiring.test.mjs'
      - 'test/order-notifications.test.js'
      - '.github/workflows/verify-notification-delivery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'notification-delivery-guard.js'
      - 'shipping-discord-dm-ledger.js'
      - 'order-notifications.js'
      - 'admin-push.js'
      - 'membership-lapse-notifications.js'
      - 'discord-community.js'
      - 'server.js'
      - 'test/notification-delivery-guard.test.mjs'
      - 'test/order-notifications.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all notification source syntax
        run: |
          node --check notification-delivery-guard.js
          node --check shipping-discord-dm-ledger.js
          node --check order-notifications.js
          node --check admin-push.js
          node --check membership-lapse-notifications.js
          node --check discord-community.js
          node --check server.js
      - name: Install web push test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run durable notification and gateway tests
        run: node --test test/notification-delivery-guard.test.mjs test/notification-wiring.test.mjs test/order-notifications.test.js test/sku-reminders.test.mjs test/drop-sku-alerts.test.mjs test/discord-skus.test.js
