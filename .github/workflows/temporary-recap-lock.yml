name: Temporary recap image dependency lock synchronization
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - discord-recap-graphic.js
permissions:
  contents: write
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == 'kaleb689/SLABSNGRABSACO' && github.event.pull_request.head.ref == 'feature/approved-recap-image-20261119'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-recap-image-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate and commit dependency lock for this branch
        run: |
          node -e "const p=require('./package-lock.json');if(!p.packages['node_modules/sharp'])process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Sharp dependency for approved recap graphics"
            git push origin HEAD:feature/approved-recap-image-20261119
          fi
