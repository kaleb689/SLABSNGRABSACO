name: Build ACO Studio Windows full installer
on:
  push:
    branches: [fix/aco-studio-duplicate-email-review-20261018]
    paths:
      - '.github/aco-studio-build/**'
      - '.github/workflows/build-aco-studio-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aco-studio-windows-release
  cancel-in-progress: true
env:
  ACO_VERSION: '4.13.15'
jobs:
  windows:
    name: Windows x64 installer, source tests and installed application smoke
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified existing application source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,pathlib,zipfile,io
          root=pathlib.Path('.github/aco-studio-build')
          parts=sorted(root.glob('aco-studio-v4.13.5.part-*.b64'))
          assert len(parts)==11,'Existing source archive is incomplete'
          contents=base64.b64decode(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(contents).hexdigest()=='8836f7172b81365fb2f794d984e349f3dbb02f5aaf78dce8b69b7a38ddee2570','Original source hash mismatch'
          with zipfile.ZipFile(io.BytesIO(contents)) as z:
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              z.extractall('build-src')
          assert pathlib.Path('build-src/App/main.js').is_file()
          PY
      - name: Apply every preserved ACO Studio feature overlay
        shell: bash
        run: |
          set -euo pipefail
          node .github/aco-studio-build/personal-import/apply.cjs build-src/App
          python .github/aco-studio-build/profile-workshop/unpack.py workshop-overlay
          node workshop-overlay/apply.cjs build-src/App
          node .github/aco-studio-build/native-updater/apply.cjs build-src/App
          node .github/aco-studio-build/release-v4139.cjs build-src/App
          python - <<'PY'
          from pathlib import Path
          # Extracted original Windows sources use CRLF. Every existing
          # overlay anchor was authored for LF; normalize source scripts only.
          for p in Path('build-src/App').glob('*.js'):
           data=p.read_bytes()
           if b'\r\n' in data:p.write_bytes(data.replace(b'\r\n',b'\n'))
          PY
          python .github/aco-studio-build/personal-navigation/unpack.py navigation-overlay
          node navigation-overlay/apply.cjs build-src/App
          node .github/aco-studio-build/email-vaults/apply.cjs build-src/App
          node .github/aco-studio-build/completed-profiles/apply.cjs build-src/App
          node .github/aco-studio-build/profile-library/apply.cjs build-src/App
          node -e "const p=require('./build-src/App/package.json');if(p.version!==process.env.ACO_VERSION || !p.dependencies['electron-updater'] || p.build.appId!=='com.slabsngrabsaco.jigstudio.owner') process.exit(1)"
      - name: Install runtime and build dependencies
        working-directory: build-src/App
        run: npm install --no-audit --no-fund
      - name: Test Windows auto-update, Personal isolation, profile scans and old functions
        working-directory: build-src/App
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          # mac-full-updates.test.js validates /Applications paths and Unix symlinks;
          # its tests are exercised on both native Mac runners, not Windows.
          node --test $(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'mac-full-updates.test.js' | sort) | tee regression-results.txt
          test -f node_modules/electron-updater/package.json
      - name: Produce actual Windows x64 NSIS setup installer
        working-directory: build-src/App
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --win nsis --x64 --publish never
          test -f "dist/ACO-Studio-Setup-${ACO_VERSION}-x64.exe"
      - name: Verify packaged ACO Studio code, updater, icon and executable
        working-directory: build-src/App
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/win-unpacked/JigStudio.exe
          for f in main.js profile-vault.js profile-library-ui.js win-full-updates.js mac-full-updates.js personal-access.js ACOStudioIcon.png JigStudio.ico; do
            test -s "dist/win-unpacked/resources/app/$f"
          done
          test -f dist/win-unpacked/resources/app/node_modules/electron-updater/package.json
          node -e "const p=require('./dist/win-unpacked/resources/app/package.json');if(p.version!==process.env.ACO_VERSION||p.build.appId!=='com.slabsngrabsaco.jigstudio.owner')process.exit(1)"
          python - <<'PY'
          import pathlib,os
          p=pathlib.Path('dist')/('ACO-Studio-Setup-'+os.environ['ACO_VERSION']+'-x64.exe')
          assert p.stat().st_size>50_000_000, 'NSIS output missing or unusually small'
          with p.open('rb') as f: assert f.read(2)==b'MZ', 'Installer is not Windows PE executable'
          print('Validated Windows NSIS setup:',p.name,'bytes:',p.stat().st_size)
          PY
      - name: Launch packaged Windows native application in isolated smoke mode
        shell: pwsh
        working-directory: build-src/App
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ACO_STUDIO_SMOKE_FILE = (Join-Path $env:RUNNER_TEMP 'aco-windows-renderer-smoke.txt')
          $p=Start-Process -FilePath (Join-Path (Get-Location) 'dist/win-unpacked/JigStudio.exe') -ArgumentList '--aco-studio-ci-smoke' -PassThru
          $ready=$false
          try {
            for ($i=0;$i -lt 60;$i++) {
              if(Test-Path $env:ACO_STUDIO_SMOKE_FILE) {$ready=$true;break}
              if($p.HasExited){break}
              Start-Sleep -Seconds 1
              $p.Refresh()
            }
            if(-not $ready){throw 'Installed Windows ACO Studio did not initialize the native renderer'}
            if(-not ((Get-Content $env:ACO_STUDIO_SMOKE_FILE -Raw) -match 'ACO Studio desktop renderer launched')){throw 'Desktop renderer controls are incomplete'}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
      - name: Generate a SHA-512-verified stable Windows full installer feed
        working-directory: build-src/App
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,hashlib,base64,datetime
          root=pathlib.Path('dist');v=os.environ['ACO_VERSION'];p=root/f'ACO-Studio-Setup-{v}-x64.exe'
          h=hashlib.sha512()
          with p.open('rb') as f:
           for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
          digest=base64.b64encode(h.digest()).decode()
          feed=(f'version: {v}\nfiles:\n  - url: {p.name}\n    sha512: {digest}\n    size: {p.stat().st_size}\npath: {p.name}\nsha512: {digest}\nreleaseDate: {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n')
          (root/'latest.yml').write_text(feed,encoding='utf-8')
          print('Validated Windows update feed, SHA-512, installer size and version')
          PY
      - name: Record Windows signing availability
        working-directory: build-src/App
        shell: pwsh
        run: |
          $file = Join-Path (Get-Location) "dist/ACO-Studio-Setup-$env:ACO_VERSION-x64.exe"
          $signature = Get-AuthenticodeSignature $file
          $signature.Status.ToString() | Set-Content -Path dist/windows-signing-status.txt
          Write-Host "Windows installer signature status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {Write-Warning 'Windows SmartScreen or installer approval may be required without Authenticode code signing.'}
      - uses: actions/upload-artifact@v4
        with:
          name: ACO-Studio-${{ env.ACO_VERSION }}-windows-x64
          path: |
            build-src/App/dist/ACO-Studio-Setup-*.exe
            build-src/App/dist/latest.yml
            build-src/App/dist/*.blockmap
            build-src/App/dist/windows-signing-status.txt
            build-src/App/regression-results.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ACO-Studio-windows-failure
          path: |
            build-src/App/regression-results.txt
            build-src/App/dist/builder-debug.yml
          if-no-files-found: ignore
  publish:
    name: Publish verified Windows installer and stable automatic-update feed
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ACO-Studio-${{ env.ACO_VERSION }}-windows-x64
          path: installers
      - name: Verify Windows installer and latest.yml before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,base64,pathlib,os,re
          v=os.environ['ACO_VERSION'];root=pathlib.Path('installers');p=root/f'ACO-Studio-Setup-{v}-x64.exe';f=root/'latest.yml'
          assert p.stat().st_size>50_000_000
          s=f.read_text();assert f'version: {v}' in s
          assert p.name in s and str(p.stat().st_size) in s
          sha=base64.b64encode(hashlib.sha512(p.read_bytes()).digest()).decode()
          assert 'sha512: '+sha in s,'Version metadata and installer digest differ'
          assert (root/'windows-signing-status.txt').read_text().strip() in ('Valid','NotSigned','UnknownError')
          PY
      - name: Upload downloadable installer and atomically advance stable Windows feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_TAG="aco-studio-v${ACO_VERSION}-windows-unsigned"
          SETUP="installers/ACO-Studio-Setup-${ACO_VERSION}-x64.exe"
          cat > installers/RELEASE-NOTES.md <<'NOTES'
          Standalone Windows 64-bit NSIS installer for ACO Studio. Existing customer and Personal vaults, native profiles, addresses, cards, userData directory and importer/exporter are preserved. The program checks and automatically downloads/installs verified future Windows NSIS updates from the official release feed before Admin sign-in. Existing website Admin session authorizes the desktop automatically, or the secure sign-in opens before the desktop. The Connect button is no longer needed. Same email across Target, Walmart or Pokemon Center is allowed; website-linked account mirrors no longer create false duplicate records.
          This build is not Windows Authenticode signed: Windows SmartScreen approval may be required at first install, and UAC may be required according to installation permissions. Automated tests used synthetic local data and CI runner smoke tests, not the owner's real vaults. Automatic updating is supported from this build onward, not from older installers with a different updater.
          NOTES
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            gh release upload "$VERSION_TAG" "$SETUP" installers/latest.yml installers/windows-signing-status.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION_TAG" "$SETUP" installers/latest.yml installers/windows-signing-status.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ACO Studio ${ACO_VERSION} - Windows 64-bit" --notes-file installers/RELEASE-NOTES.md --prerelease
          fi
          # The generic updater has one pinned and permanent base URL.
          # Publish the verified installer FIRST; then replace latest.yml LAST.
          FEED_TAG="aco-studio-windows-updates"
          if gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$FEED_TAG" "$SETUP" --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload "$FEED_TAG" installers/latest.yml --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$FEED_TAG" "$SETUP" installers/latest.yml --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ACO Studio - Windows automatic update feed' --notes 'Full NSIS installers with SHA-512 checksums for future startup updates.' --prerelease
          fi
          gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Verify public release and stable feed metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,os
          repo=os.environ['GITHUB_REPOSITORY'];v=os.environ['ACO_VERSION']
          for tag,required in [(f'aco-studio-v{v}-windows-unsigned',[f'ACO-Studio-Setup-{v}-x64.exe']),('aco-studio-windows-updates',['latest.yml',f'ACO-Studio-Setup-{v}-x64.exe'])]:
           url=f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
           with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'aco-studio-build'}),timeout=30) as response: record=json.load(response)
           names=[a['name'] for a in record['assets']]
           assert all(x in names for x in required),(tag,names)
           print('Verified release assets:',tag)
          PY
