name: Verify Discord lapsed-profile bulk Extend
on:
  pull_request:
    paths:
      - 'discord-community.js'
      - 'membership-lapse-notifications.js'
      - 'server.js'
      - 'test/discord-lapse-payload.test.mjs'
      - '.github/workflows/verify-discord-lapsed-bulk.yml'
  push:
    branches: [main]
    paths:
      - 'discord-community.js'
      - 'membership-lapse-notifications.js'
      - 'server.js'
      - 'test/discord-lapse-payload.test.mjs'
      - '.github/workflows/verify-discord-lapsed-bulk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and exact lapsed extension regression
        run: |
          node --check server.js
          node --check discord-community.js
          node --check membership-lapse-notifications.js
          node --test test/discord-lapse-payload.test.mjs
