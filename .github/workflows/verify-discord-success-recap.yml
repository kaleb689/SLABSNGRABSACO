name: Verify Discord Success checkout price parsing

on:
  push:
    paths:
      - discord-source-price-field-policy.js
      - tests/discord-source-price-field-policy.test.js
      - server.js
      - .github/workflows/verify-discord-success-recap.yml
  pull_request:
    paths:
      - discord-source-price-field-policy.js
      - tests/discord-source-price-field-policy.test.js
      - server.js
      - .github/workflows/verify-discord-success-recap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate server and source syntax
        run: |
          node --check server.js
          node --check discord-source-price-field-policy.js
      - name: Run Discord source price and retailer regression tests
        run: node --test tests/discord-source-price-field-policy.test.js
