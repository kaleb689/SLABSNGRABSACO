name: Verify Discord owner drop announcements and recaps

on:
  push:
    paths:
      - discord-live-drop-recap.js
      - discord-recap-graphic.js
      - discord-manual-drop-recap.js
      - tests/discord-manual-drop-recap.test.js
      - discord-bot-avatar.js
      - assets/discord-bot-avatar-sng-20261114.b64
      - tests/discord-bot-avatar.test.js
      - discord-community.js
      - server-discord-source-recap-review.js
      - discord-source-recap-report.js
      - tests/discord-live-drop-recap.test.js
      - tests/discord-recap-graphic.test.js
      - test/discord-managed-panel-buttons.test.mjs
      - test/discord-interaction-ack-policy.test.mjs
      - .github/workflows/verify-discord-live-drop-recap.yml
  pull_request:
    paths:
      - discord-live-drop-recap.js
      - discord-recap-graphic.js
      - discord-manual-drop-recap.js
      - tests/discord-manual-drop-recap.test.js
      - discord-bot-avatar.js
      - assets/discord-bot-avatar-sng-20261114.b64
      - tests/discord-bot-avatar.test.js
      - discord-community.js
      - server-discord-source-recap-review.js
      - discord-source-recap-report.js
      - tests/discord-live-drop-recap.test.js
      - tests/discord-recap-graphic.test.js
      - test/discord-managed-panel-buttons.test.mjs
      - test/discord-interaction-ack-policy.test.mjs
      - .github/workflows/verify-discord-live-drop-recap.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check the Discord feature and bot syntax
        run: |
          node --check discord-live-drop-recap.js
          node --check discord-recap-graphic.js
          node --check discord-manual-drop-recap.js
          node --check discord-bot-avatar.js
          node --check discord-community.js
          node --check server-discord-source-recap-review.js
      - name: Verify confirmation, timing, source and duplicate protections
        run: node --test test/discord-interaction-ack-policy.test.mjs test/discord-managed-panel-buttons.test.mjs tests/discord-live-drop-recap.test.js tests/discord-manual-drop-recap.test.js tests/discord-recap-graphic.test.js tests/discord-source-recap-tax-shipping.test.js tests/discord-bot-avatar.test.js
