name: Verify Private Edition website licensing isolation
on:
  push:
    branches: [main]
    paths:
      - 'private-studio-license.js'
      - 'billing-receipts.js'
      - 'test/billing-receipts.test.mjs'
      - 'server.js'
      - 'public/private-studio-site.js'
      - 'public/private-studio-site.css'
      - 'public/index.html'
      - 'test/private-studio-license.test.mjs'
      - '.github/workflows/verify-private-studio-license.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check private-studio-license.js
      - run: node --check billing-receipts.js
      - run: node --check public/private-studio-site.js
      - run: node --check server.js
      - run: node --test test/private-studio-license.test.mjs test/billing-receipts.test.mjs
      - name: Ensure standalone application cannot touch original owner data
        run: |
          test -f private-edition/main.cjs
          ! grep -RE 'server-studio-customer-sync|/api/admin/|owner-vault' private-edition/main.cjs private-edition/preload.cjs private-edition/renderer.js
