name: Publish ACO Studio 4.13.89 Mac only after full native verification
on:
  # Authorized publication when approved changes reach main. The publish
  # job is gated by full native Mac regression, signature, first-launch,
  # update, rollback and data-preservation checks.
  # Next-version release triggered by this workflow merge; full native tests, signing and preservation gate publishing.
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-aco-studio-v41348-macos.yml'
      - '.github/aco-studio-build/native-updater/**'
      - '.github/aco-studio-build/profile-library/**'
      - '.github/aco-studio-build/completed-profiles/**'
      - 'private-edition/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aco-studio-489-macos
  cancel-in-progress: false
env:
  ACO_VERSION: '4.13.89'
jobs:
  mac:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.arch }} navigation, installer, update and rollback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover verified original and preserve existing Personal importer
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/aco-original-source.zip"
          test "$(find .github/aco-studio-build -name 'aco-studio-v4.13.5.part-*.b64' -type f | wc -l | tr -d ' ')" = 11
          cat .github/aco-studio-build/aco-studio-v4.13.5.part-*.b64 | base64 --decode > "$ZIP"
          test "$(shasum -a 256 "$ZIP" | awk '{print $1}')" = '8836f7172b81365fb2f794d984e349f3dbb02f5aaf78dce8b69b7a38ddee2570'
          unzip -t "$ZIP"
          mkdir -p build-src
          unzip -q "$ZIP" -d build-src
          node .github/aco-studio-build/personal-import/apply.cjs build-src/App
      - name: Apply tested independent fields, vault forms and blank profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/aco-studio-build/profile-workshop/unpack.py workshop-overlay
          node workshop-overlay/apply.cjs build-src/App
          node .github/aco-studio-build/native-updater/apply.cjs build-src/App
      - name: Resolve signing mode without exposing credentials
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
            echo 'adhoc=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$CSC_LINK" && -z "$CSC_KEY_PASSWORD" && -z "$APPLE_ID" && -z "$APPLE_APP_SPECIFIC_PASSWORD" && -z "$APPLE_TEAM_ID" ]]; then
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            echo 'adhoc=true' >> "$GITHUB_OUTPUT"
            echo '::warning::This is an ad-hoc signed preview, not Apple-notarized.'
          else
            echo '::error::Apple signing secrets are incomplete.'
            exit 1
          fi
      - name: Prepare shorter Finder label and preserve original data identity
        env:
          ACO_ADHOC_MODE: ${{ steps.signing.outputs.adhoc }}
        shell: bash
        run: node .github/aco-studio-build/release-v4139.cjs build-src/App
      - name: Apply separate Personal sidebar, scoped navigation and preview repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/aco-studio-build/personal-navigation/unpack.py navigation-overlay
          node navigation-overlay/apply.cjs build-src/App
      - name: Add retailer email banks and same-vault profile generation
        run: node .github/aco-studio-build/email-vaults/apply.cjs build-src/App
      - name: Add completed profile sections and authorized full card views
        run: node .github/aco-studio-build/completed-profiles/apply.cjs build-src/App
      - name: Add scoped profile library and linked customer preparation
        run: node .github/aco-studio-build/profile-library/apply.cjs build-src/App
      - name: Add Drop News retailer briefing
        run: node .github/aco-studio-build/drop-news/apply.cjs build-src/App
      - name: Install build dependencies
        working-directory: build-src/App
        run: npm install --no-audit --no-fund
      - name: Syntax and all profile, isolation, navigation and updater regression tests
        working-directory: build-src/App
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do node --check "$file"; done
          bash -n mac-full-update.sh
          node --test --test-reporter=tap tests/*.test.js | tee regression-results.txt
          node --test tests/profile-bidirectional-sync.test.js
      - name: Build real Mac DMG and complete signed app update ZIP
        working-directory: build-src/App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.adhoc == 'true' && 'false' || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.signing.outputs.adhoc }}' == 'true' ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          node -e "const {build,Platform}=require('electron-builder');build({targets:Platform.MAC.createTarget(['dmg','zip']),publish:'never'}).catch(e=>{console.error(e.stack);process.exit(1)})"
      - name: Verify DMG copy, architecture, full code signature and shipped controls
        working-directory: build-src/App
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 2 -type d -name 'ACO Studio.app' -print -quit)"
          DMG="dist/ACO-Studio-${ACO_VERSION}-${{ matrix.arch }}.dmg"
          ZIP="dist/ACO-Studio-${ACO_VERSION}-${{ matrix.arch }}.zip"
          test -d "$APP" && test -f "$DMG" && test -f "$ZIP"
          test "$(stat -f '%z' "$DMG")" -gt 50000000
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$ACO_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.slabsngrabsaco.jigstudio.owner'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")" = 'ACO Studio'
          for file in personal-profile-import.js profile-workshop-service.js profile-workshop-ui.js jig-field-core.js profile-draft-core.js mac-full-updates.js mac-full-update.sh mac-update-archive.js mac-updates-ui.js workspace-core.js personal-navigation.js personal-navigation.css email-vault-ui.js profile-completion-core.js native-admin-ui.js native-touchid.js; do
            test -f "$APP/Contents/Resources/app/$file"
          done
          grep -Fq 'profileWorkshop:Object.freeze' "$APP/Contents/Resources/app/preload.js"
          grep -Fq 'ownerSecurity:Object.freeze' "$APP/Contents/Resources/app/preload.js"
          grep -Fq "owner:touch-id" "$APP/Contents/Resources/app/main.js"
          grep -Fq 'personalJigsTab' "$APP/Contents/Resources/app/index.html"
          # Inspect shipped app payload for the release-specific controls.
          for file in owner-health-advisor.js card-pool-policy.js profile-library-ui.js profile-workshop-service.js profile-vault.js; do
            test -s "$APP/Contents/Resources/app/$file"
          done
          grep -Fq 'owner:health-scan' "$APP/Contents/Resources/app/main.js"
          grep -Fq 'setHardCard' "$APP/Contents/Resources/app/preload.js"
          grep -Fq 'data-pkc-reconcile' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'Scan All Recovery Sources' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'Old CVV-labeled field inventory' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'scanOriginals:true' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'An existing independent profile reference would be replaced or cleared' "$APP/Contents/Resources/app/profile-vault.js"
          grep -Fq 'exactFullCardMatch' "$APP/Contents/Resources/app/profile-vault.js"
          grep -Fq 'exactFullCardMatch' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'duplicateReviewEntries' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'unusedEmailConflicts' "$APP/Contents/Resources/app/profile-vault.js"
          grep -Fq 'reconcileExistingLiveProfiles' "$APP/Contents/Resources/app/profile-vault.js"
          grep -Fq 'reconcileLivePreview' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'Review existing Live duplicates' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'newEmailBankConfirmPanel' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'Exact shared card number' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'duplicateDetails' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'duplicateRepairPreview' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'Fix Duplicate' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'New Email Gen setup READY' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'changeDraftDestinations' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'randomDestinationConfirmArea' "$APP/Contents/Resources/app/index.html"
          grep -Fq 'BANK_PASSPHRASE_MISMATCH' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'NO_SAVED_LOGIN' "$APP/Contents/Resources/app/emailgen-owner-login-ipc.js"
          grep -Fq 'confirmStartNewEmailBank' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'supersededLive' "$APP/Contents/Resources/app/profile-vault.js"
          grep -Fq 'newest imported row automatically REPLACES' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'randomTestSenderPassword' "$APP/Contents/Resources/app/index.html"
          grep -Fq 'senderPassword' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'Use a different sending mailbox' "$APP/Contents/Resources/app/emailgen-forwarding-test.js"
          grep -Fq 'Cloudflare publication issues' "$APP/Contents/Resources/app/app.js"
          grep -Fq 'Choose more of one or more jig styles' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'Add Random Apt / Unit / Ste / # / Number' "$APP/Contents/Resources/app/profile-workshop-ui.js"
          grep -Fq 'distributeJigs' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'target.house.integer.' "$APP/Contents/Resources/app/profile-library-core.js"
          grep -Fq 'prepareSecurityCodeExport' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'preparedExportCodes' "$APP/Contents/Resources/app/profile-workshop-service.js"
          grep -Fq 'Target profiles have an empty required reference field' "$APP/Contents/Resources/app/profile-library-core.js"
          grep -Fq 'Preview saved Card Bank recovery' "$APP/Contents/Resources/app/profile-library-ui.js"
          test -f "$APP/Contents/Resources/app/owner-backup-manager.js"
          grep -Fq 'Automatic encrypted backups & restore points' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq "checkpoint('critical-change')" "$APP/Contents/Resources/app/local-card-vault.js"
          grep -Fq "checkpoint('pre-change')" "$APP/Contents/Resources/app/jig-address-banks.js"
          grep -Fq 'Export BLOCKED:' "$APP/Contents/Resources/app/profile-library-service.js"
          grep -Fq 'Review blocked export' "$APP/Contents/Resources/app/profile-library-ui.js"
          grep -Fq 'diagnoseOnly===true' "$APP/Contents/Resources/app/profile-library-service.js"
          if [[ '${{ matrix.arch }}' == 'arm64' ]]; then
            lipo -archs "$APP/Contents/MacOS/ACO Studio" | grep -qw arm64
          else
            lipo -archs "$APP/Contents/MacOS/ACO Studio" | grep -qw x86_64
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          mkdir -p "$RUNNER_TEMP/aco-mount" "$RUNNER_TEMP/aco-install-copy"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/aco-mount" "$DMG"
          ditto "$RUNNER_TEMP/aco-mount/ACO Studio.app" "$RUNNER_TEMP/aco-install-copy/ACO Studio.app"
          hdiutil detach "$RUNNER_TEMP/aco-mount"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/aco-install-copy/ACO Studio.app"
          if [[ '${{ steps.signing.outputs.mode }}' == 'developer-id' ]]; then
            spctl --assess --type execute "$APP"
            xcrun stapler validate "$APP"
          fi
          shasum -a 256 "$DMG" "$ZIP"
      - name: Verify installed app loads Personal tab, retailer buttons and preview handlers
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/aco-install-copy/ACO Studio.app"
          export ACO_STUDIO_SMOKE_FILE="$RUNNER_TEMP/aco-renderer-ready.txt"
          "$APP/Contents/MacOS/ACO Studio" --aco-studio-ci-smoke > "$RUNNER_TEMP/aco-smoke.log" 2>&1 &
          PID=$!
          for i in $(seq 1 50); do
            [[ -s "$ACO_STUDIO_SMOKE_FILE" ]] && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if [[ ! -s "$ACO_STUDIO_SMOKE_FILE" ]]; then cat "$RUNNER_TEMP/aco-smoke.log"; exit 1; fi
          grep -q 'ACO Studio desktop renderer launched' "$ACO_STUDIO_SMOKE_FILE"
          wait "$PID"
      - name: Full-app update, real restart, failed-launch rollback and data preservation
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.adhoc == 'true' && 'false' || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.signing.outputs.adhoc }}' == 'true' ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          node .github/aco-studio-build/native-updater/ci-self-update.cjs build-src/App
      - name: Record signing and source verification
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ steps.signing.outputs.mode }}' > "build-src/App/dist/signing-${{ matrix.arch }}.txt"
          cp build-src/App/regression-results.txt "build-src/App/dist/regression-${{ matrix.arch }}.txt"
          test -s "build-src/App/dist/update-test-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ACO-Studio-${{ env.ACO_VERSION }}-${{ matrix.arch }}
          path: |
            build-src/App/dist/*.dmg
            build-src/App/dist/*.zip
            build-src/App/dist/signing-*.txt
            build-src/App/dist/update-test-*.json
            build-src/App/dist/regression-*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ACO-Studio-failure-${{ matrix.arch }}
          path: |
            build-src/App/regression-results.txt
            ~/Library/Application Support/SLABSNGRABSACO ACO Studio - Owner/aco-native-updates/*/install.log
            ~/Library/Application Support/SLABSNGRABSACO ACO Studio - Owner/aco-native-update-status.json
          if-no-files-found: ignore
          retention-days: 3
  publish:
    if: github.ref == 'refs/heads/main'
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ACO-Studio-4.13.89-*
          path: installers
          merge-multiple: true
      - name: Verify Apple Silicon before publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('installers');v='4.13.89';platforms={};sums=[]
          arch='arm64'
          mode=(root/f'signing-{arch}.txt').read_text().strip()
          assert mode in ('adhoc','developer-id')
          tag=f'aco-studio-v{v}-macos-'+('adhoc' if mode=='adhoc' else 'notarized')
          tests=json.loads((root/f'update-test-{arch}.json').read_text())
          assert tests['version']==v and all(tests.get(k) is True for k in ('update','restart','rollback','dataPreserved'))
          assert '# fail 0' in (root/f'regression-{arch}.txt').read_text()
          for ext in ('dmg','zip'):
            p=root/f'ACO-Studio-{v}-{arch}.{ext}';assert p.stat().st_size>50_000_000
            with p.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
            sums.append(digest+'  '+p.name)
            if ext=='zip':platforms['darwin-'+arch]={'url':f'https://github.com/kaleb689/SLABSNGRABSACO/releases/download/{tag}/{p.name}','sha256':digest,'size':p.stat().st_size,'bundleName':'ACO Studio.app','signing':mode}
          (root/'mac-update.json').write_text(json.dumps({'schema':1,'channel':'owner','appId':'com.slabsngrabsaco.jigstudio.owner','version':v,'notes':'ACO Studio 4.13.89 now auto-selects unitless Address Bank Main addresses when selected profiles already have apartment numbers, adds the owner-requested unit variation, and automatically matches shipping and billing. Original bank entries, cards and security codes remain unchanged. Jig previews whenever options change, randomizes eligible style allocation while respecting selected distribution counts, and tests up to 65 approved Apt/Unit/Ste/#/bare A-D or 1-9 second-line choices on unitless addresses without modifying saved apartment numbers. Existing profile, card, code and bank data remain preserved. ACO Studio now reuses its existing Mac app instance to prevent duplicate Dock launch icons, offers a verified Desktop shortcut to the Applications copy, and no longer force-launches extra instances on updates. Profile action buttons now follow the profile list in a sticky grouped toolbar with right-click Delete Profile and Delete Selected confirmations. Card bank renders in smaller batches, profile card rendering uses one document fragment, and cached page selection prevents avoidable repeat work. Existing records and backups remain preserved. Customer Profiles now offer an owner-only View card details & code action for saved full-number Studio cards, showing existing independent profile references from the exact customer vault without exposing payment CVV/CVC or unmasking website-only cards. New retailer profiles stay in their own unexported tab until saved to an export file. Export All can preview and skip matching emails or optionally full-card duplicates without changing the saved vault. Per-retailer counts show Live, New, Ready and Draft; previously approved quantity and selection fixes remain. Profile creation quantities can be typed when accounts are selected. A smaller quantity uses only the first requested accounts from that selection, with exact emails shown for confirmation. Selection highlights update in place without rebuilding the card grid, unchanged background data no longer rebuilds the Unused page, and open creation windows defer background redraws. Selected profile counts remain visible and opening a batch from an already-selected account preserves the batch. Existing profiles, cards, addresses, email banks and routing rules are preserved.','platforms':platforms},indent=2))
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n');(root/'release-tag.txt').write_text(tag)
          PY
      - name: Release the tested installers and advance verified feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(cat installers/release-tag.txt)"
          cat > notes.md <<'NOTES'
          ACO Studio 4.13.89 fixes selected profile batches whose current addresses all have existing units. Once the owner selects the optional second-line jig, Studio automatically searches unitless Main entries in the same Address Bank, previews any needed address-source reassignment, and adds a random Apt/Unit/Ste/#/bare A-D or 1-9 identifier to the new address. All generated shipping/billing address fields match automatically. Saved Main bank entries, original unit identities, cards and independent security codes are preserved, and explicit Apply is required.\n          ACO Studio 4.13.89 refreshes previews when jig checkboxes, quantities or address-reuse settings change. The engine randomizes selected styles within owner-approved limits and searches all 65 permitted second-line variants before reporting exhaustion, preferring unused identifiers for each main address. Existing units are immutable. Previews never change saved profiles until explicit Apply.
          ACO Studio 4.13.89 identifies the exact saved profile preventing a selected export when an independent Security Code is missing or conflicting. An owner-only read-only review shows the profile email and card last four, never the code itself. Owner may explicitly export only complete profiles while the incomplete records remain saved. Full-batch export stays blocked rather than silently emitting blank fields.
          ACO Studio 4.13.89 adds encrypted automatic local workspace checkpoints across profile, email, card and address vault files. It takes daily checkpoints while Studio is open, pre-change checkpoints in the serialized vault write paths, and offers manual Create backup now plus a visible backup inventory. Review & revert requires two explicit owner confirmations and creates a complete safety checkpoint before replacing anything. Encrypted backups are stored separately from live vault directories and never uploaded.
          ACO Studio 4.13.89 adds owner-reviewed recovery from the existing encrypted saved Card Bank when an exact full-card match is found. Preview shows counts without exposing codes; only explicit confirmation restores missing independently labeled profile references. Existing nonempty references and other vault data are preserved; ambiguous and unmatched references are excluded.
          ACO Studio 4.13.89 prevents silent Security Code omission on profile and Jig Studio exports. A temporary export copy resolves existing independent references by exact full card number from the same encrypted Card Bank. Missing or conflicting references block the export rather than writing an incomplete file. No saved Security Codes are rewritten or migrated. Native tests verify exact output fields, unchanged vaults, complete-card identity, no silent omissions, restart, rollback and data preservation.
          ACO Studio 4.13.89 adds even distribution across selected address jig categories by default and an optional Choose more of one or more jig styles control with per-category counts. Remaining eligible profiles are automatically allocated after owner-preferred quantities. Target integer house additions (+1 through +9) join fractional and hyphenated variants. Existing units, card records and vault ownership remain unchanged until owner review and Apply.
          ACO Studio 4.13.89 fixes checked Target fractional and hyphenated hard jigs taking effect in Profiles and retains one unjigged Main per 18 instead of every address group. Both Profiles and Jig Studio Saved Profiles now provide an OFF-by-default Add optional Apt/Unit/Ste/#/bare A-D or 1-9 second-line checkbox with quantity. Existing units never change and duplicate-address overrides still require explicit review.
          ACO Studio 4.13.89 adds an explicitly optional second-line Apt/Unit/Ste/#/number toggle and exact quantity selector in Profiles Jig. No new units are added when unchecked; existing units are never edited; selected Target fractional/hyphen variations remain available and their applied rules are visible in previews. The customer-linked jig preview also has an opt-in unit toggle. Existing profiles are unchanged until owner review and Apply.
          ACO Studio 4.13.89 makes saved apartment, suite and unit values immutable during preview and save. Eligible unitless addresses receive a new Apt, Unit, #, Ste or number-only second line using A-D or 1-9 only when the optional checkbox is enabled; otherwise no second line is added. The review visibly labels JIGGED addresses, colors changed fields and reports which rules applied. Duplicate authorization remains explicit.
          ACO Studio 4.13.89 groups Jig options by transformation family (ordinals, compass directions, apartment/suite/unit, street suffixes, and hard house number variants). Clicking Jig begins preview immediately without Resume jig. Exact full-address reuse across accounts in the same vault requires a reviewed and explicit Allow duplicate jigs confirmation; customer vaults remain isolated and prior profiles stay untouched until Apply.
          ACO Studio 4.13.89 adds a Paste accounts action in Profiles for Target, Walmart, Pokémon Center, Costco, and Sam's Club. Supports email:password, email:::password and email; password, imports only into the selected encrypted vault, skips existing same-retailer accounts, and preserves account passwords when profiles are created.
          ACO Studio 4.13.89 fixes editable profile quantities and visible selection counts. ACO Studio now reuses its existing Mac app instance to prevent duplicate Dock launch icons, offers a verified Desktop shortcut to the Applications copy, and no longer force-launches extra instances on updates. Profile action buttons now follow the profile list in a sticky grouped toolbar with right-click Delete Profile and Delete Selected confirmations. Card bank renders in smaller batches, profile card rendering uses one document fragment, and cached page selection prevents avoidable repeat work. Existing records and backups remain preserved. New retailer profiles stay in their own unexported tab until saved to an export file. Export All can preview and skip matching emails or optionally full-card duplicates without changing the saved vault. Per-retailer counts show Live, New, Ready and Draft; previously approved quantity and selection fixes remain. Profile creation quantities can be typed when accounts are selected. A smaller quantity uses only the first requested accounts from that selection, with exact emails shown for confirmation. Selection highlights update in place without rebuilding the card grid, unchanged background data no longer rebuilds the Unused page, and open creation windows defer background redraws. Selected profile counts remain visible and opening a batch from an already-selected account preserves the batch. Existing profiles, cards, addresses, email banks and routing rules are preserved. Native Apple Silicon regression, installed-app, updater, rollback and data-preservation checks gate publication.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/*arm64.dmg installers/*arm64.zip installers/SHA256SUMS.txt installers/mac-update.json installers/update-test-arm64.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ACO Studio 4.13.89 Mac' --notes-file notes.md --prerelease
          else
            gh release create "$TAG" installers/*arm64.dmg installers/*arm64.zip installers/SHA256SUMS.txt installers/mac-update.json installers/update-test-arm64.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ACO Studio 4.13.89 Mac' --notes-file notes.md --prerelease
          fi
          # Check that published artifacts exist before advertising the
          # update to existing owners.
