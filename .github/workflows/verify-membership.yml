name: Verify membership discounts and onboarding
on:
  push:
    branches:
      - feature/fixed-price-limited-use-discounts
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/admin-pool-search.js
      - run: node --check public/admin-mobile.js
      - run: node --check discord-community.js
      - run: node --check discord-checkout-identity.js
      - run: node --test test/discord-checkout-identity.test.mjs test/webhook-success.test.js
      - run: node verify-discord-controls.mjs
      - run: node --test test/admin-discounts.test.js test/checkout-discounts.test.js test/discord-skus.test.js test/signup-onboarding.test.js test/optional-retailer-accounts.test.js test/optional-retailer-api.test.js test/admin-customer-layout.test.js test/retailer-export-format.test.js test/managed-pool-search.test.js test/live-auto-refresh.test.mjs test/admin-mobile-live-refresh.test.mjs test/admin-pool-disclosure.test.mjs
