name: Verify membership discounts and onboarding
on:
  push:
    branches:
      - feature/fixed-price-limited-use-discounts
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check checkout-reporting.js
      - run: node --check server.js
      - run: node --test test/managed-customer-write-policy.test.mjs test/studio-customer-sync.test.mjs test/studio-linked-billing.test.mjs test/studio-live-http.test.mjs
      - run: node --test test/membership-gift-billing.test.mjs test/membership-billing-math.test.mjs
      - run: node --check public/app.js
      - run: node --check public/app-dashboard.js
      - run: node --check public/app-dashboard-data.js
      - run: node --check shipping-tracking-policy.js
      - run: node --check public/admin-pool-search.js
      - run: node --check public/admin-mobile.js
      - run: node --check public/admin-live-notifications.js
      - run: node --test test/admin-ipad-notifications.test.mjs
      - run: node --check public/admin-passkey-controls.js
      - run: node --test test/admin-ipad-stability-passkeys.test.mjs
      - run: node --test test/admin-nested-dropdown-reset.test.mjs
      - run: node --check address-jig-choices.js
      - run: node --check postal-jig-validation.js
      - run: node --test test/postal-jig-validation.test.mjs
      - run: node --check public/admin-workspace-tabs.js
      - run: node --check public/admin-jig-picker.js
      - run: node --test test/admin-jig-picker-workspace.test.mjs
      - run: node --test test/admin-summary-notification-layout.test.mjs
      - run: node --check discord-community.js
      - run: node --check discord-checkout-identity.js
      - run: node --check discord-checkout-profile-aliases.js
      - run: node --check discord-checkout-owner-evidence.js
      - run: node --test test/discord-checkout-owner-evidence.test.mjs
      - run: node --test test/drop-sku-alerts.test.mjs test/sku-reminders.test.mjs test/pwa-worker.test.mjs
      - run: node --test test/checkout-reporting.test.mjs test/community-product-identity.test.mjs
      - run: node --test test/admin-success-ui.test.mjs
      - run: node --test test/admin-success-breakdowns.test.mjs
      - run: node --test test/admin-grouped-orders-and-selected-controls.test.mjs
      - run: node --test test/public-community-hits.test.mjs
      - run: node --check checkout-price-policy.js
      - run: node --check checkout-admin-receipt-policy.js
      - run: node --check retailer-order-total.js
      - run: node --check public/app-dashboard-data.js
      - run: node --test test/checkout-spend-and-controls.test.mjs test/app-dashboard.test.mjs
      - run: node --test test/customer-checkout-values.test.mjs
      - run: node --check retailer-order-enrichment.js
      - run: node --test test/pkc-receipt-enrichment.test.mjs
      - run: node --check checkout-owner-order-evidence.js
      - run: node --test test/checkout-images-and-embeds.test.mjs
      - run: node --test test/pkc-owner-evidence.test.mjs
      - run: node --check public/admin-checkout-match.js
      - run: node --test test/stellar-fast-checkouts.test.mjs
      - run: node --test test/checkout-owner-admin-recovery.test.mjs
      - run: node --check checkout-owner-screenshot-evidence.js
      - run: node --test test/screenshot-checkout-ownership.test.mjs
      - run: node --check checkout-owner-backfills.js
      - run: node --test test/checkout-owner-backfills.test.mjs
      - run: node --check checkout-owner-verified-day.js
      - run: node --test test/checkout-owner-verified-day.test.mjs test/checkout-product-preservation.test.mjs
      - run: node --test test/customer-app-uniform-ui.test.mjs
      - run: node --check public/app-drop-controls.js
      - run: node --test test/customer-app-drop-controls.test.mjs
      - run: node --test test/membership-prices.test.js
      - run: node --test test/mobile-reference-theme.test.mjs
      - run: node --test test/custom-date-ranges.test.mjs
      - run: node --test test/admin-signups-and-date-layout.test.mjs
      - run: node --test test/admin-community-spend-and-premium-controls.test.mjs
      - run: node --test test/admin-community-spend.test.mjs
      - run: node --test test/discord-hits-ingestion-coverage.test.mjs test/checkout-video-formats.test.mjs test/discord-unlinked-community-totals.test.mjs test/discord-module-lifecycle.test.mjs
      - run: node --test test/pkc-receipt-enrichment.test.mjs
      - run: node --test test/checkout-price-policy.test.mjs test/discord-hit-mirror-policy.test.mjs test/discord-source-history.test.mjs test/discord-checkout-identity.test.mjs test/discord-checkout-profile-aliases.test.mjs test/webhook-success.test.js test/success-source-policy.test.mjs test/shikari-checkout.test.mjs test/cancellation-tracking.test.mjs test/order-notifications.test.js
      - run: node verify-discord-controls.mjs
      - run: node --test test/admin-discounts.test.js test/checkout-discounts.test.js test/discord-skus.test.js test/signup-onboarding.test.js test/optional-retailer-accounts.test.js test/optional-retailer-api.test.js test/admin-customer-layout.test.js test/retailer-export-format.test.js test/managed-pool-search.test.js test/live-auto-refresh.test.mjs test/admin-mobile-live-refresh.test.mjs test/admin-pool-disclosure.test.mjs
