name: Apply owner-only Walmart inventory policy
on:
  push:
    branches: [fix/owner-only-walmart-unused-20261028]
    paths:
      - 'scripts/reserve-owner-walmart.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/reserve-owner-walmart.mjs
      - run: node --check server.js && node --test test/owner-walmart-unused.test.mjs test/managed-pool-auto-provision.test.mjs
      - name: Commit verified server patch
        run: |
          git config user.name "aco-studio-ci"
          git config user.email "aco-studio-ci@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet || git commit -m "Reserve Walmart inventory for owner Personal Unused; disable customer availability"
          git push origin HEAD:fix/owner-only-walmart-unused-20261028
