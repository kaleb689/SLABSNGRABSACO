name: Diagnose Cloudflare staging API access (read-only)
on:
  push:
    branches: [feature/cloudflare-high-volume-inbound-staging-20261119]
    paths: [.github/workflows/cloudflare-inbound-diagnose.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configured account-scoped API access without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN:-}" || ! "${CF_ACCOUNT:-}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::GitHub Cloudflare secrets missing or invalid shape"
            exit 1
          fi
          check() {
            local name="$1" url="$2" status codes
            status=$(curl -sS --retry 1 -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H 'Accept: application/json' "https://api.cloudflare.com/client/v4${url}")
            codes=$(jq -cr '[.errors[]?.code]|join(",")' response.json 2>/dev/null || echo unknown)
            echo "${name}: HTTP ${status}; Cloudflare codes: ${codes}"
            rm -f response.json
          }
          # This ID was reported by Wrangler's account discovery under the
          # existing token; only print a yes/no comparison with the secret.
          if [[ "${CF_ACCOUNT}" == "2cf1cfd109c7a0a8fea197fb50ed591b" ]]; then
            echo "GitHub account ID matches Cloudflare token's discovered account: YES"
          else
            echo "::error::GitHub account ID matches Cloudflare token's discovered account: NO"
          fi
          check 'Token active' '/user/tokens/verify'
          check 'Account metadata' "/accounts/${CF_ACCOUNT}"
          check 'R2 bucket list (read-only)' "/accounts/${CF_ACCOUNT}/r2/buckets?per_page=1"
          check 'D1 database list (read-only)' "/accounts/${CF_ACCOUNT}/d1/database?per_page=1"
          check 'Queues list (read-only)' "/accounts/${CF_ACCOUNT}/queues?per_page=1"
          check 'Workers scripts list (read-only)' "/accounts/${CF_ACCOUNT}/workers/scripts?per_page=1"
