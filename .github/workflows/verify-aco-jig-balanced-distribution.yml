name: Verify ACO Studio balanced jigs
on:
  pull_request:
    paths:
      - '.github/aco-studio-build/profile-library/**'
      - '.github/aco-studio-build/completed-profiles/**'
      - '.github/workflows/verify-aco-jig-balanced-distribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jig-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every changed component
        run: |
          node --check .github/aco-studio-build/profile-library/profile-library-core.js
          node --check .github/aco-studio-build/profile-library/profile-library-service.js
          node --check .github/aco-studio-build/profile-library/profile-library-ui.js
          node --check .github/aco-studio-build/completed-profiles/profile-workshop-ui.js
      - name: Run profile library and jig regression tests
        run: |
          node --test .github/aco-studio-build/profile-library/profile-library.test.js
          node --test .github/aco-studio-build/profile-library/profile-live-ui.test.js
          node --test .github/aco-studio-build/profile-library/profile-duplicate-scan.test.js
